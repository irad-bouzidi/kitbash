spring:
  application:
    name: demo
  threads:
    virtual:
      enabled: true
  datasource:
    url: "${DEMO_DB_URL}"
    username: "${DEMO_DB_USERNAME}"
    password: "${DEMO_DB_PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${DEMO_AUTH_ISSUER_URI}"
          audiences: "${DEMO_AUTH_AUDIENCE}"
demo:
  environment-name: "${DEMO_ENVIRONMENT_NAME}"
  max-widgets-per-page: 50
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
info:
  app:
    name: demo
    environment: "${DEMO_ENVIRONMENT_NAME}"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
