# Build, test, lint and publish an image. Every job is one command; anything more
# belongs in the build itself, where it can be run locally.
stages: [build, image]

default:
  image: eclipse-temurin:21-jdk-alpine
  cache:
    key:
      files: [gradle/libs.versions.toml]
    paths: [.gradle/caches, .gradle/wrapper]

variables:
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

build:
  stage: build
  # `check` depends on spotlessCheck, so a formatting failure is a pipeline failure
  # rather than a review comment.
  script:
    - ./gradlew --no-daemon build
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/libs/*.jar
    expire_in: 1 week

image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
