# Single source of truth for every dependency coordinate in this project.
#
# The [versions] and [libraries] entries below the markers are assembled by kitbash from
# the dependencies each selected recipe declares — see docs/hooks.md. Everything above a
# marker is this project's own and is safe to edit.

[versions]
spotless = "7.0.4"
palantir-java-format = "2.57.0"
spring-boot = "3.5.5"
spring-dependency-management = "1.1.7"
flyway-core = "11.10.5"
flyway-postgresql = "11.10.5"
springdoc-openapi-webmvc = "2.8.9"
# kitbash:versions

[libraries]
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi-webmvc" }
# kitbash:libraries

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
# kitbash:plugins
