name: demo
services:
  app:
    build: "."
    ports:
    - 8080:8080
    environment:
      DEMO_ENVIRONMENT_NAME: "${DEMO_ENVIRONMENT_NAME:-local}"
      DEMO_DB_URL: "${DEMO_DB_URL:-jdbc:postgresql://db:5432/demo}"
      DEMO_DB_USERNAME: "${DEMO_DB_USERNAME:-demo}"
      DEMO_DB_PASSWORD: "${DEMO_DB_PASSWORD:-demo}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
    - 5432:5432
    volumes:
    - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U demo -d demo
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db-data: {}
