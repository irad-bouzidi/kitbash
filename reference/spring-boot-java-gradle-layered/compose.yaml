name: demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        # Not `depends_on: [db]`. Postgres accepts TCP connections seconds before it
        # accepts queries, and the app would race it on a cold start.
        condition: service_healthy
    environment:
      DEMO_DB_URL: jdbc:postgresql://db:5432/demo
      DEMO_DB_USERNAME: demo
      DEMO_DB_PASSWORD: demo
      DEMO_ENVIRONMENT_NAME: local
    ports:
      - "8080:8080"

volumes:
  db-data:
