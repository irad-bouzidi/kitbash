server {
    # 8080 rather than 80, because a non-root process cannot bind a privileged port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page application: every unknown path is the app's own route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # kitbash:api-proxy

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed filenames, so they can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
