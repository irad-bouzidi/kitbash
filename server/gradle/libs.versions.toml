# Single source of truth for every dependency coordinate in the server build.
# Modules reference aliases from here; no version literals in build scripts.
[versions]
java = "21"
spring-boot = "3.5.5"
spring-dependency-management = "1.1.7"
pebble = "3.2.4"
jackson = "2.19.2"
junit = "5.13.4"
assertj = "3.27.3"
testcontainers = "1.21.3"
# 2.x is the current API on Jackson 2; 3.x moved to Jackson 3 (tools.jackson), which
# would put two Jackson majors on the api module's classpath alongside Spring Boot.
json-schema-validator = "2.0.7"
springdoc = "2.8.13"
slf4j = "2.0.17"
# The generated projects pin their own Flyway through Spring Boot's BOM; this one is the
# generator's own, and they move independently on purpose.
flyway = "11.13.2"
postgresql = "42.7.8"
# The S3 client only. The full SDK bundle is ~200 MB of services this never calls, and the
# object store here speaks S3 because MinIO does (§5) rather than because it is AWS.
aws-sdk = "2.35.9"
spotless = "7.0.4"
palantir-java-format = "2.57.0"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
pebble = { module = "io.pebbletemplates:pebble", version.ref = "pebble" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
testcontainers-minio = { module = "org.testcontainers:minio" }
testcontainers-localstack = { module = "org.testcontainers:localstack" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
