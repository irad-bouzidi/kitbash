spring:
  application:
    name: kitbash
  # The database is opt-in, and that is a §10/§12 decision rather than a convenience.
  #
  # Half of this service — /metadata, /validate, /generate — needs no persistence at all: the
  # catalog lives in git and a generation is a pure function of a selection. Presets, history and
  # share links are the half that needs rows. A generator that refused to start without Postgres
  # would make the useful half hostage to the optional half, and §12 is explicit that verification
  # must stay independent of the API's persistence.
  #
  # So the JDBC and Flyway autoconfigurations are off unless the `persistence` profile turns them
  # on, and that profile is what a deployment with a database runs.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  threads:
    virtual:
      # Generation is CPU work that streams a response, not I/O fan-out (§5).
      # MVC on virtual threads streams zips fine and keeps the code blocking and
      # readable; WebFluxwould buy nothing here.
      enabled: true
  mvc:
    problemdetails:
      enabled: true

  # §13, §18: a resource server and nothing else. There is no registration and no password
  # handling here, because the audience is one internal team behind the SSO they already have.
  #
  # The issuer is deliberately not defaulted. A service that cannot verify a token must not start,
  # because starting would mean serving unauthenticated — so a deployment sets KITBASH_OIDC_ISSUER
  # (or SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI), and a laptop runs the `dev-auth`
  # profile below. `IssuerRequired` turns the missing case into a sentence rather than a stack
  # trace about a decoder bean.

kitbash:
  security:
    # The claim roles arrive in, and the two roles this service authorises on. Named in
    # configuration rather than in code: the mapping to an identity provider's groups is the part
    # most likely to change, and renaming a group should not be a deploy.
    roles-claim: ${KITBASH_OIDC_ROLES_CLAIM:roles}
    preset-author: ${KITBASH_ROLE_PRESET_AUTHOR:kitbash-author}
    publisher: ${KITBASH_ROLE_PUBLISHER:kitbash-publisher}
  objectstore:
    # §10's zip cache. Off unless the `objectstore` profile is active, for the same reason
    # persistence is: the generator half of this service needs neither, and a missing bucket must
    # not be able to stop /generate from working.
    endpoint: ${KITBASH_S3_ENDPOINT:}
    bucket: ${KITBASH_S3_BUCKET:kitbash-artifacts}
    access-key: ${KITBASH_S3_ACCESS_KEY:}
    secret-key: ${KITBASH_S3_SECRET_KEY:}
    region: ${KITBASH_S3_REGION:us-east-1}
    # §10's uniform thirty days, applied as a bucket lifecycle rule rather than by the sweep —
    # the store is better placed to expire its own objects than a job that would have to list
    # them.
    retention-days: ${KITBASH_S3_RETENTION_DAYS:30}
  limits:
    # Modest, per §13 and §18 — one internal team, not a public service. These exist to stop a
    # loop in somebody's script from saturating the box, not to meter usage, and a cache hit
    # spends none of it.
    generate-per-minute: ${KITBASH_LIMIT_GENERATE_PER_MINUTE:60}
    generate-burst: ${KITBASH_LIMIT_GENERATE_BURST:20}
    share-per-minute: ${KITBASH_LIMIT_SHARE_PER_MINUTE:30}
    share-burst: ${KITBASH_LIMIT_SHARE_BURST:10}

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        # metrics because §27 wants the cache hit rate and the popular selections observable from
        # day one: the hit rate is the number that says whether determinism is still holding.
        include: health,info,metrics
  info:
    env:
      enabled: true

# The OpenAPI document is the contract the web client's types are generated from (§9), so it
# is served in every environment rather than only in development — a spec that exists only on
# a developer's machine is a spec that drifts from what is deployed.
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

---
# With a database. `SPRING_PROFILES_ACTIVE=persistence` plus a datasource URL is the whole of it;
# the exclusions above are dropped, Flyway runs the §10 migrations at startup, and the repository
# beans appear.
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude:
  datasource:
    url: ${KITBASH_DB_URL:jdbc:postgresql://localhost:5432/kitbash}
    username: ${KITBASH_DB_USER:kitbash}
    password: ${KITBASH_DB_PASSWORD:kitbash}
  flyway:
    # Explicit rather than implied: a migration is the one thing in this service that changes a
    # database it does not own, so where the migrations come from is worth being able to read.
    locations: classpath:db/migration
    # The schema is created from V1 on an empty database. Baselining an existing one would mean
    # trusting that it already matches, which is how two environments quietly diverge.
    baseline-on-migrate: false

---
# Local development, with a stub issuer instead of the corporate one. `docker compose up` runs it
# alongside the service and the web app, so the whole stack works on a laptop with no access to
# the company's identity provider — and the security configuration under test is the real one
# rather than a disabled one, which is the point of stubbing the issuer rather than the filter.
spring:
  config:
    activate:
      on-profile: dev-auth
  security:
    oauth2:
      resourceserver:
        jwt:
          # The key set rather than the issuer, and only here.
          #
          # The browser reaches the stub on the host's published port and the API reaches it by
          # its service name, so a token minted for the browser carries an `iss` the API would
          # not recognise. Verifying against the key set keeps the signature check — which is the
          # part that matters — without demanding that two different networks agree on one name.
          # Deployments set KITBASH_OIDC_ISSUER and get issuer validation as well.
          jwk-set-uri: ${KITBASH_OIDC_JWKS:http://oidc:8080/kitbash/jwks}
