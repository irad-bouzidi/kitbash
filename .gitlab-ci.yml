# Kitbash's own pipeline. Kept deliberately thin: every job is one command, so the
# GitHub Actions workflow beside it stays a transcription rather than a second
# implementation (see docs/adr/0002-ci-on-both-gitlab-and-github.md).
stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build:
  stage: build
  image: eclipse-temurin:21-jdk
  cache:
    key:
      files:
        - server/gradle/libs.versions.toml
        - server/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    - cd server && ./gradlew check
  artifacts:
    when: always
    reports:
      junit: server/*/build/test-results/test/TEST-*.xml

# The reference project is the source of truth recipe content is extracted from
# (§4). If it stops building, every recipe derived from it is wrong and the
# equality test in kitbash-19 is asserting against a broken baseline.
reference-build:
  stage: build
  image: eclipse-temurin:21-jdk
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key:
      files:
        - reference/spring-boot-java-gradle-layered/gradle/libs.versions.toml
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    - cd reference/spring-boot-java-gradle-layered && ./gradlew build
  artifacts:
    when: always
    reports:
      junit: reference/spring-boot-java-gradle-layered/build/test-results/test/TEST-*.xml

web:
  stage: build
  image: node:24-alpine
  before_script:
    - corepack enable
    - cd web && pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm test
    - pnpm build
  cache:
    key:
      files:
        - web/pnpm-lock.yaml
    paths:
      - web/node_modules

web-e2e:
  stage: build
  image: mcr.microsoft.com/playwright:v1.55.0-noble
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  before_script:
    - corepack enable
    - apt-get update && apt-get install -y --no-install-recommends openjdk-21-jdk-headless curl
  script:
    # A real jar rather than `bootRun`, so the smoke test runs against the
    # artefact and the step exits once the server is listening.
    - cd server && ./gradlew :api:bootJar && cd ..
    - java -jar server/api/build/libs/api-*.jar &
    - for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/actuator/health && break; sleep 2; done
    - cd web && pnpm install --frozen-lockfile && pnpm test:e2e
  artifacts:
    when: on_failure
    paths:
      - web/playwright-report
    expire_in: 1 week

generated-build:
  stage: build
  image: docker:28-cli
  timeout: 30 minutes
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash curl unzip openjdk21-jdk
  script:
    - docker build -t kitbash/verify-jvm:latest -f verification/images/jvm/Dockerfile .
    # The phase exit test: the downloaded zip unzips and ./gradlew build passes,
    # in a container, never on the API host (§12).
    - ./verification/run-cell.sh verification/selections/phase0-spring-java-gradle.json
