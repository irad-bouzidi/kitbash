# Mirror of .gitlab-ci.yml. The repository lives on GitHub, so this is the pipeline
# that actually gates merges; the GitLab file is kept in step because the plan's
# deployment target is GitLab (docs/adr/0002-ci-on-both-gitlab-and-github.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 02:00 UTC. §12: the matrix runs every night against the catalog as it is,
    # because a recipe rots when nothing upstream of it does.
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        working-directory: server
        run: ./gradlew check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: server/*/build/test-results/test/TEST-*.xml
          if-no-files-found: ignore

  reference-build:
    name: reference project builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The reference project is the source of truth recipe content is extracted
      # from (§4). If it stops building, every recipe derived from it is wrong.
      # Includes the Testcontainers suite, which uses the runner's Docker daemon.
      - name: ./gradlew build
        working-directory: reference/spring-boot-java-gradle-layered
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-test-results
          path: reference/spring-boot-java-gradle-layered/build/test-results/test/TEST-*.xml
          if-no-files-found: ignore

  frontend-reference-build:
    name: frontend reference builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/react-vite-ts/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: reference/react-vite-ts/frontend/package.json

      # The second reference project, and the standalone-frontend case (§18). If it stops
      # building, `frontend-react-vite` is emitting a project nobody can run.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by default,
          # and this project's package.json lives one directory down.
          package_json_file: web/package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  web-e2e:
    name: web smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by default,
          # and this project's package.json lives one directory down.
          package_json_file: web/package.json

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # A real jar rather than `bootRun`, so the smoke test runs against the
      # artefact and the step exits once the server is listening.
      - name: Build and start the API
        working-directory: server
        run: |
          ./gradlew :api:bootJar
          java -jar api/build/libs/api-*.jar &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "the API did not become healthy" >&2
          exit 1

      - name: pnpm test:e2e
        working-directory: web
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  matrix:
    name: verification matrix
    runs-on: ubuntu-latest
    # Generous relative to the ten-minute budget the runner prints: this bound catches a
    # wedged runner, the runner's own per-cell timeout catches a wedged build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the ecosystem images
        run: |
          docker build -t kitbash/verify-jvm:latest  -f verification/images/jvm/Dockerfile  .
          docker build -t kitbash/verify-node:latest -f verification/images/node/Dockerfile .

      # The phase exit test: each cell generates a project and runs that stack's real build
      # and test commands, in a container, never on the API host (§12).
      # One runner, two triggers, differing only in which cells they select. A third —
      # a user's own combination — plugs into the same runner in kitbash-37.
      - name: ./gradlew :verify:runMatrix
        working-directory: server
        run: >-
          ./gradlew :verify:runMatrix
          -Pkitbash.trigger=${{ github.event_name == 'schedule' && 'nightly' || 'merge-request' }}

      - name: Upload the matrix logs and status page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-matrix
          path: verification/build
          if-no-files-found: ignore
