# Mirror of .gitlab-ci.yml. The repository lives on GitHub, so this is the pipeline
# that actually gates merges; the GitLab file is kept in step because the plan's
# deployment target is GitLab (docs/adr/0002-ci-on-both-gitlab-and-github.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 02:00 UTC. §12: the matrix runs every night against the catalog as it is,
    # because a recipe rots when nothing upstream of it does.
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The contributed-recipe sandbox confines its worker in an unprivileged user namespace
      # (kitbash-47 §6.4), and Ubuntu 24.04 blocks those by default through AppArmor — the runner
      # answers `unshare: write failed /proc/self/uid_map: Operation not permitted`.
      #
      # Granted here rather than worked around in the test. The suite refuses to run unconfined
      # on purpose: a sandbox that quietly degrades is worse than none, so a host that cannot
      # confine must make the tests fail rather than pass vacuously. That leaves exactly one
      # honest option for CI, which is to be a host that can.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: ./gradlew check
        working-directory: server
        run: ./gradlew check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: server/*/build/test-results/test/TEST-*.xml
          if-no-files-found: ignore

  reference-build:
    # One job per JVM reference project. A reference project is the source of truth recipe
    # content is extracted from (§4), so if one stops building, every recipe derived from it
    # is wrong — and until §29 this job built only the first of them, which meant the Maven
    # reference added in §28 was checked by the equality test and by nothing that compiles it.
    name: reference builds (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: spring-boot-java-gradle-layered
            build: ./gradlew build
            results: build/test-results/test/TEST-*.xml
          - project: spring-boot-java-gradle-hexagonal
            build: ./gradlew build
            results: build/test-results/test/TEST-*.xml
          - project: spring-boot-java-gradle-modular
            build: ./gradlew build
            results: build/test-results/test/TEST-*.xml
          - project: spring-boot-java-maven-layered
            build: ./mvnw -B verify
            results: target/surefire-reports/TEST-*.xml
          - project: spring-boot-kotlin-gradle-layered
            build: ./gradlew build
            results: build/test-results/test/TEST-*.xml
          - project: spring-boot-kotlin-gradle-hexagonal
            build: ./gradlew build
            results: build/test-results/test/TEST-*.xml
          - project: spring-boot-kotlin-gradle-modular
            build: ./gradlew build
            results: build/test-results/test/TEST-*.xml
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Includes the Testcontainers suite, which uses the runner's Docker daemon.
      - name: ${{ matrix.build }}
        working-directory: reference/${{ matrix.project }}
        run: ${{ matrix.build }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-test-results-${{ matrix.project }}
          path: reference/${{ matrix.project }}/${{ matrix.results }}
          if-no-files-found: ignore

  frontend-reference-build:
    name: frontend reference builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/react-vite-ts/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: reference/react-vite-ts/frontend/package.json

      # The second reference project, and the standalone-frontend case (§18). If it stops
      # building, `frontend-react-vite` is emitting a project nobody can run.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by default,
          # and this project's package.json lives one directory down.
          package_json_file: web/package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  web-e2e:
    name: web smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by default,
          # and this project's package.json lives one directory down.
          package_json_file: web/package.json

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # The stub issuer, the same one `docker compose up` runs. §13 closes every endpoint but
      # health, so the smoke test needs a real token — and stubbing the issuer rather than the
      # filter means the security configuration this job exercises is the one that ships.
      - name: Start the stub issuer
        run: |
          docker run -d --name kitbash-oidc -p 9500:8080 \
            -e JSON_CONFIG='{"interactiveLogin":false,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"kitbash","tokenExpiry":3600,"requestMappings":[{"requestParam":"client_id","match":"kitbash-web","claims":{"sub":"dev-user","roles":["kitbash-author","kitbash-publisher"]}}]}]}' \
            ghcr.io/navikt/mock-oauth2-server:2.1.11
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:9500/kitbash/.well-known/openid-configuration && exit 0
            sleep 2
          done
          echo "the stub issuer did not come up" >&2
          exit 1

      # A real jar rather than `bootRun`, so the smoke test runs against the
      # artefact and the step exits once the server is listening.
      # Presets are rows, so the smoke test needs the database too — §23's done-when is that a
      # preset saved from the wizard survives a cold load and generates in one click, and a
      # preset that was never stored cannot.
      - name: Start Postgres
        run: |
          docker run -d --name kitbash-postgres -p 5432:5432 \
            -e POSTGRES_DB=kitbash -e POSTGRES_USER=kitbash -e POSTGRES_PASSWORD=kitbash \
            postgres:16-alpine
          for i in $(seq 1 60); do
            docker exec kitbash-postgres pg_isready -U kitbash -d kitbash && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Build and start the API
        working-directory: server
        env:
          SPRING_PROFILES_ACTIVE: persistence,dev-auth
          KITBASH_DB_URL: jdbc:postgresql://localhost:5432/kitbash
          KITBASH_OIDC_JWKS: http://localhost:9500/kitbash/jwks
        run: |
          ./gradlew :api:bootJar
          java -jar api/build/libs/api-*.jar &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "the API did not become healthy" >&2
          exit 1

      - name: pnpm test:e2e
        working-directory: web
        env:
          VITE_OIDC_ISSUER: http://localhost:9500/kitbash
          VITE_OIDC_CLIENT_ID: kitbash-web
        run: pnpm test:e2e

  # §44's exit criterion: `npx create-stack` produces the same project the web wizard does for the
  # same selection, byte for byte. That needs a running API, and a parity test with no API skips —
  # so this job exists rather than leaving the one assertion that matters to a developer's laptop.
  create-stack:
    name: create-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/create-stack/package.json

      - name: Install
        working-directory: clients/create-stack
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        working-directory: clients/create-stack
        run: pnpm lint

      - name: pnpm build
        working-directory: clients/create-stack
        run: pnpm build

      # The same stub issuer the web smoke test uses. §13 closes every endpoint but health, so the
      # parity test needs a real token — and stubbing the issuer rather than the filter means the
      # security configuration under test is the one that ships.
      - name: Start the stub issuer
        run: |
          docker run -d --name kitbash-oidc-cs -p 9600:8080 \
            -e JSON_CONFIG='{"interactiveLogin":false,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"kitbash","tokenExpiry":3600,"requestMappings":[{"requestParam":"client_id","match":"*","claims":{"sub":"dev-user","roles":["kitbash-author"]}}]}]}' \
            ghcr.io/navikt/mock-oauth2-server:2.1.11
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:9600/kitbash/.well-known/openid-configuration && exit 0
            sleep 2
          done
          echo "the stub issuer did not come up" >&2
          exit 1

      # No database: this job generates, and generation needs no persistence (§10). A Postgres here
      # would be a container started to make a profile happy.
      - name: Build and start the API
        working-directory: server
        env:
          SPRING_PROFILES_ACTIVE: dev-auth
          KITBASH_OIDC_JWKS: http://localhost:9600/kitbash/jwks
        run: |
          ./gradlew :api:bootJar
          java -jar api/build/libs/api-*.jar &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "the API did not become healthy" >&2
          exit 1

      - name: pnpm test
        working-directory: clients/create-stack
        env:
          KITBASH_API: http://localhost:8080
          # Set so a job whose API failed to start fails rather than skipping the one test it
          # exists to run and reporting green.
          KITBASH_REQUIRE_API: "true"
        run: |
          set -euo pipefail
          KITBASH_TOKEN=$(curl -sf -X POST http://localhost:9600/kitbash/token \
            -d 'grant_type=client_credentials&client_id=create-stack&client_secret=x&scope=openid' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          export KITBASH_TOKEN
          pnpm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  matrix:
    name: verification matrix ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Generous relative to the budget the runner prints: this bound catches a wedged runner, the
    # runner's own per-cell timeout catches a wedged build.
    timeout-minutes: 45
    strategy:
      # A red shard must not cancel the others. The question a maintainer has in the morning is
      # "what broke", and one shard's answer is a twelfth of it.
      fail-fast: false
      matrix:
        # Six on a pull request, which shards eighteen cells into threes; the nightly enumerates
        # ninety-eight and uses all twelve. Shard assignment is round-robin over sorted ids, so a
        # flaky cell is always in the same shard and can be rerun on its own.
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the ecosystem images
        run: |
          docker build -t kitbash/verify-jvm:latest  -f verification/images/jvm/Dockerfile  .
          docker build -t kitbash/verify-node:latest -f verification/images/node/Dockerfile .
          docker build -t kitbash/verify-ci:latest   -f verification/images/ci/Dockerfile   .
          docker build -t kitbash/verify-mobile:latest -f verification/images/mobile/Dockerfile .

      # The phase exit test: each cell generates a project and runs that stack's real build
      # and test commands, in a container, never on the API host (§12).
      # One runner, two triggers, differing only in which cells they select. A third —
      # a user's own combination — plugs into the same runner in kitbash-37.
      # Nightly enumerates the full matrix from the catalog (§35); a pull request runs the
      # checked-in representative cells. One runner, two sources, and the same sharding over both.
      - name: ./gradlew :verify:runMatrix
        working-directory: server
        run: >-
          ./gradlew :verify:runMatrix
          -Pkitbash.trigger=${{ github.event_name == 'schedule' && 'nightly' || 'merge-request' }}
          ${{ github.event_name == 'schedule' && '-Pkitbash.enumerate=true' || '' }}
          -Pkitbash.shard=${{ matrix.shard }}

      # §40: what the history set looked like last night, so tonight can say what changed. A run
      # cannot compare itself to the previous one, so it publishes what it used and the step below
      # does the diff — a stack that drops out because usage moved is information, and one that
      # drops out because a recipe was renamed is a coverage hole that looks identical from inside
      # a single run.
      - name: Which history cells changed since the last nightly
        if: github.event_name == 'schedule' && strategy.job-index == 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=verification/build/history-cells.tsv
          [ -f "$current" ] || { echo "No history cells this run."; exit 0; }

          previous=$(gh run list --workflow=ci.yml --event=schedule --status=success \
            --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "No previous nightly to compare against."
            cat "$current"
            exit 0
          fi

          mkdir -p /tmp/previous
          gh run download "$previous" -n verification-matrix-0 -D /tmp/previous 2>/dev/null || true
          if [ ! -f /tmp/previous/history-cells.tsv ]; then
            echo "The previous nightly published no history set."
            cat "$current"
            exit 0
          fi

          echo "### History cells, against nightly $previous" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          diff /tmp/previous/history-cells.tsv "$current" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the matrix logs and status page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # One per shard, because two shards uploading the same name is a race.
          name: verification-matrix-${{ strategy.job-index }}
          path: verification/build
          if-no-files-found: ignore
