# yaml-language-server: $schema=../_schema/recipe.schema.json
#
# Owns compose.yaml and nothing else. Each recipe contributes its own service and its own
# Dockerfile, because a container recipe that knew how to build a Spring Boot image would
# know a technology's name, which is the one thing outside /recipes/<that technology> that
# must never happen (§19). What this recipe provides is the file and the contract:
#
#   `containers` guarantees a compose.yaml with a `services` map.
#   `http-server` guarantees that the application's service in it is called `app`.
id: infra-docker
version: 1.1.0
kind: infra
label: Docker and Compose
slot: docker
# `docker` is what the wizard's toggle is named, and `containers` is what other recipes
# test for. Two names for one thing looks redundant until a second container runtime
# exists: the toggle is a product decision, the capability is a contract.
provides: [containers, docker]
requires: [project-root]

# No required variables: compose.yaml needs only the project name, which is an envelope
# field every template can read. The Java toolchain moved out with the Dockerfile.

files:
  - from: files/**

patches:
  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:stack -->"
    lines:
      - "- **Containers** — a compose file wiring the stack together, with healthchecks and non-root images"

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:start -->"
    lines:
      - "```bash"
      - "docker compose up --build"
      - "```"
      - ""
      - "That brings everything up, waits for the database to be healthy, and starts the service on"
      - "**http://localhost:8080** — documented at `/swagger-ui.html`, health at `/actuator/health`."
      - ""

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:work -->"
    lines:
      - "```bash"
      - "docker compose up -d db       # just the database, to run the app from your IDE"
      - "```"
      - ""
