# yaml-language-server: $schema=../_schema/recipe.schema.json
id: ci-gitlab
version: 1.0.0
kind: ci
label: GitLab CI
slot: ci
provides: [ci]
requires: [project-root]

variables:
  required: [javaVersion]

files:
  - from: files/**

# One marker this recipe places and owns:
#
#   .gitlab-ci.yml   # kitbash:jobs
#
# A recipe with something to run in CI appends a job there. Stages are deliberately not
# extensible: a recipe that could add a stage could also reorder the pipeline, and the two
# that exist — build, then image — are enough for anything that is not a deployment.

patches:
  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:stack -->"
    lines:
      - "- **CI** — GitLab CI: build, test, format check, and a container image on the default branch"
