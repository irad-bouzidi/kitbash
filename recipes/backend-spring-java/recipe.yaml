# yaml-language-server: $schema=../_schema/recipe.schema.json
id: backend-spring-java
version: 1.1.0
frameworkVersion: "3.5.5"
kind: backend
label: Spring Boot (Java)
slot: backend

# `java-sources` is what lets a recipe that needs to ship a source file — the database recipe's
# integration test — know which language to ship, without naming this recipe (§4). `jvm-project`
# is not enough for that: §29 added a second JVM language, and both provide it.
provides: [http-server, rest-api, openapi-spec, jvm-project, java-sources]
requires: [project-root, build-tool, database]
# Still no conflictsWith, and now for a better reason than "the recipe does not exist yet".
# §29 added `backend-spring-kotlin` in this same `backend` slot, and a slot holds one recipe —
# so the two already exclude each other and the loader refuses a conflictsWith that says so
# again. See docs/recipe-format.md.

options:
  - id: architecture
    type: enum
    values: [layered, hexagonal, modular-monolith]
    default: layered
    label: Architecture
    help: >-
      Determines the package layout and the direction dependencies are allowed to point.
      Each one ships an ArchUnit test inside the generated project, so the choice is something
      your build checks rather than something a README claims — §11 is explicit that an
      architecture option which only renames folders should be dropped.

variables:
  required: [groupId, packageName, javaVersion, entityName, entityTable, envPrefix]

files:
  # Everything a choice of architecture does not move: the application class, the framework
  # wiring under config/, and the resources. Three copies of these would be three places to
  # fix a logging change.
  - from: files/**

  # And the part it does move. One directory per value of the `architecture` option, selected
  # by `when` rather than by a recipe per architecture — §30 is explicit that the architecture
  # is an option on this recipe, because a project is one backend with a shape, not three
  # backends.
  - from: arch/layered/**
    when: "architecture == 'layered'"
  - from: arch/hexagonal/**
    when: "architecture == 'hexagonal'"
  - from: arch/modular-monolith/**
    when: "architecture == 'modular-monolith'"

patches:
  - op: addComposeService
    target: compose.yaml
    when: "capability('containers')"
    service: app
    definition:
      build: "."
      ports:
        - "8080:8080"

  # Spring's plugins, not the build tool's: the build-tool recipe knows how to build a JVM
  # project and nothing about frameworks, so the framework's own build configuration is
  # inserted here at the markers it placed (§19).
  #
  # Two build tools means two spellings of the same idea, selected by a `when` on the capability
  # each build tool provides rather than by a branch in the engine (§28) — and by a capability
  # rather than a recipe id, because §4 is explicit that recipes never name each other.
  #
  # What is *not* duplicated is the dependency list below: an addDependency names the module it
  # belongs to and the applier resolves the build file, so adding Maven did not double it —
  # which is exactly the cost §18 was worried about.
  - op: insertAtMarker
    target: build.gradle.kts
    when: "capability('gradle-build')"
    marker: "// kitbash:plugins"
    lines:
      - "    alias(libs.plugins.spring.boot)"
      - "    alias(libs.plugins.spring.dependency.management)"

  - op: insertAtMarker
    target: gradle/libs.versions.toml
    when: "capability('gradle-build')"
    marker: "# kitbash:versions"
    lines:
      - 'palantir-java-format = "2.57.0"'
      - 'spring-boot = "3.5.5"'
      - 'spring-dependency-management = "1.1.7"'

  - op: insertAtMarker
    target: gradle/libs.versions.toml
    when: "capability('gradle-build')"
    marker: "# kitbash:plugins"
    lines:
      - 'spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }'
      - 'spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }'

  # Java the language, not Spring the framework — but this is the only recipe that brings Java
  # sources, so it is the recipe that says how they are compiled and formatted. §29 moved both
  # blocks out of `build-gradle-kts`, which had quietly become a Java recipe: it named the
  # palantir formatter and configured `JavaCompile`, and a Kotlin project generated from it
  # would have carried a formatter for a language it does not contain.
  - op: insertAtMarker
    target: build.gradle.kts
    when: "capability('gradle-build')"
    marker: "// kitbash:build"
    lines:
      - "tasks.withType<JavaCompile>().configureEach {"
      - '    options.encoding = "UTF-8"'
      - '    options.compilerArgs.add("-parameters")'
      - "}"
      - ""

  - op: insertAtMarker
    target: build.gradle.kts
    when: "capability('gradle-build')"
    marker: "// kitbash:formats"
    lines:
      - "    java {"
      - '        target("src/**/*.java")'
      - "        palantirJavaFormat(libs.versions.palantir.java.format.get())"
      - "        removeUnusedImports()"
      - "        trimTrailingWhitespace()"
      - "        endWithNewline()"
      - "    }"

  # Maven's equivalent of those two plugins: the parent pins every starter's version, and the
  # boot plugin builds the executable jar. The parent has to come before <groupId>, which is
  # where the build-tool recipe put its marker.
  - op: insertAtMarker
    target: pom.xml
    when: "capability('maven-build')"
    marker: "<!-- kitbash:parent -->"
    lines:
      - "  <parent>"
      - "    <groupId>org.springframework.boot</groupId>"
      - "    <artifactId>spring-boot-starter-parent</artifactId>"
      - "    <version>3.5.5</version>"
      - "    <relativePath/>"
      - "  </parent>"

  - op: insertAtMarker
    target: pom.xml
    when: "capability('maven-build')"
    marker: "<!-- kitbash:plugins -->"
    lines:
      - "      <plugin>"
      - "        <groupId>org.apache.maven.plugins</groupId>"
      - "        <artifactId>maven-compiler-plugin</artifactId>"
      - "        <configuration>"
      - "          <compilerArgs>"
      - "            <!-- Parameter names survive compilation, which is what lets Spring bind them. -->"
      - "            <arg>-parameters</arg>"
      - "          </compilerArgs>"
      - "        </configuration>"
      - "      </plugin>"
      - "      <plugin>"
      - "        <groupId>org.springframework.boot</groupId>"
      - "        <artifactId>spring-boot-maven-plugin</artifactId>"
      - "      </plugin>"

  # The Maven spellings of the two Gradle blocks above.
  - op: insertAtMarker
    target: pom.xml
    when: "capability('maven-build')"
    marker: "<!-- kitbash:versions -->"
    lines:
      - "    <palantir-java-format.version>2.57.0</palantir-java-format.version>"

  - op: insertAtMarker
    target: pom.xml
    when: "capability('maven-build')"
    marker: "<!-- kitbash:formats -->"
    lines:
      - "          <java>"
      - "            <includes>"
      - "              <include>src/**/*.java</include>"
      - "            </includes>"
      - "            <palantirJavaFormat>"
      - "              <version>${palantir-java-format.version}</version>"
      - "            </palantirJavaFormat>"
      - "            <removeUnusedImports/>"
      - "            <trimTrailingWhitespace/>"
      - "            <endWithNewline/>"
      - "          </java>"

  # Versionless coordinates on purpose: the Spring Boot BOM manages them, and pinning
  # one here would freeze it while the BOM moved (see docs/hooks.md).
  - op: addDependency
    target: .
    configuration: implementation
    coordinate: org.springframework.boot:spring-boot-starter-web
  - op: addDependency
    target: .
    configuration: implementation
    coordinate: org.springframework.boot:spring-boot-starter-validation
  - op: addDependency
    target: .
    configuration: implementation
    coordinate: org.springframework.boot:spring-boot-starter-actuator
  - op: addDependency
    target: .
    configuration: implementation
    coordinate: org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9
    versionRef: springdoc-openapi-webmvc
  - op: addDependency
    target: .
    configuration: testImplementation
    coordinate: org.springframework.boot:spring-boot-starter-test
  - op: addDependency
    target: .
    configuration: testRuntimeOnly
    coordinate: org.junit.platform:junit-platform-launcher

  # The architecture test's engine. testImplementation because it is a test — but a test that
  # ships to the user, so it runs in their build and not only in ours (§30).
  - op: addDependency
    target: .
    configuration: testImplementation
    coordinate: com.tngtech.archunit:archunit-junit5:1.4.1
    versionRef: archunit

  - op: appendLines
    target: .gitignore
    lines:
      - ""
      - "# Java"
      - "*.class"
      - "hs_err_pid*"
      - "replay_pid*"

  - op: addEnvVar
    target: .env.example
    composeTarget: compose.yaml
    composeService: app
    name: "{{ envPrefix }}_ENVIRONMENT_NAME"
    value: local
    comment: Free-text environment label, reported by /actuator/info and the OpenAPI description.

  # The one marker in RequiredEnvironmentValidator: a recipe that reads a new environment
  # variable adds it here, so the startup failure names the variable *and* says what it is for.
  # Declared by this recipe because this recipe owns the file (see docs/recipe-format.md).
  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:stack -->"
    lines:
      - "- **Backend** — Spring Boot {{ frameworkVersion }} on Java {{ javaVersion }}, {{ architecture }} architecture"

  # Only when there is no container recipe to give a shorter first command. §15 wants
  # the README's first screen to name the one command that starts the project.
  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:start -->"
    when: "!capability('containers')"
    lines:
      - "```bash"
      - "cp .env.example .env          # then export it, or let your IDE load it"
      - "{% if capabilities contains 'maven-build' %}./mvnw spring-boot:run{% else %}./gradlew bootRun{% endif %}"
      - "```"
      - ""
      - "The service listens on **http://localhost:8080**. The API is at `/api/{{ entityTable }}`,"
      - "documented at `/swagger-ui.html`, health at `/actuator/health`."
      - ""

  - op: insertAtMarker
    target: README.md
    when: "architecture == 'layered'"
    marker: "<!-- kitbash:layout -->"
    lines:
      - "```"
      - "src/main/java/{{ packageName | packagePath }}/"
      - "  controller/   HTTP: request and response records, the REST controller, the error handler"
      - "  service/      business rules and transaction boundaries"
      - "  repository/   Spring Data interfaces"
      - "  domain/       entities"
      - "  config/       properties, startup validation, cross-cutting filters"
      - "```"
      - ""

  - op: insertAtMarker
    target: README.md
    when: "architecture == 'hexagonal'"
    marker: "<!-- kitbash:layout -->"
    lines:
      - "```"
      - "src/main/java/{{ packageName | packagePath }}/"
      - "  domain/                       the model, with no framework on it at all"
      - "  application/                  the use cases"
      - "    port/inbound/               what the application can be asked to do"
      - "    port/outbound/              what it needs from the outside world"
      - "  adapter/inbound/web/          the REST controller and its wire types"
      - "  adapter/outbound/persistence/ the JPA row and the mapping to the domain"
      - "  config/                       properties, startup validation, filters"
      - "```"
      - ""

  - op: insertAtMarker
    target: README.md
    when: "architecture == 'modular-monolith'"
    marker: "<!-- kitbash:layout -->"
    lines:
      - "```"
      - "src/main/java/{{ packageName | packagePath }}/"
      - "  {{ entityName | camel }}/                      a module: public API at the top, everything else below"
      - "    {{ entityName }}Api.java            the only type another module may use"
      - "    internal/                 entity, repository, service, controller"
      - "  report/                     a second module, reading the first through its API"
      - "  config/                     properties, startup validation, filters"
      - "```"
      - ""

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **Configuration is validated at startup.** Every variable in `.env.example` is required;"
      - "  missing ones are reported together, by name, before the context loads."
      - "- **Logs are JSON**, one object per line, with the correlation id as a field. Every request"
      - "  gets an `X-Correlation-Id` (the caller's, if supplied) and it is echoed in the response."
      - "- **Errors are RFC 9457 problem documents**, never stack traces."

  - op: insertAtMarker
    target: README.md
    when: "architecture == 'layered'"
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **The layers are enforced.** `ArchitectureTest` fails the build if a repository imports a"
      - "  controller, or the web layer queries directly. Layered is the architecture people assume"
      - "  they have and most often do not."

  - op: insertAtMarker
    target: README.md
    when: "architecture == 'hexagonal'"
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **The domain has no framework on it**, and `ArchitectureTest` fails the build if that"
      - "  changes. JPA annotations belong on the row in `adapter/outbound/persistence`, and the"
      - "  mapping between the two is the price of being able to test the model without a context."

  - op: insertAtMarker
    target: README.md
    when: "architecture == 'modular-monolith'"
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **A module's `internal` package is private to it.** `ArchitectureTest` fails the build if"
      - "  another module reaches past the public API type, and a second rule fails on a dependency"
      - "  cycle between modules — which is what turns a set of modules back into one."
