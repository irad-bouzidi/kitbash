# yaml-language-server: $schema=../_schema/recipe.schema.json
#
# The second axis in the catalog, and the one that makes the engine falsifiable: until a
# recipe of a different kind exists, a single backend would work just as well with a
# checked-in tree.
#
# It lives under `frontend/` even when it is the only thing selected. §15's own layout puts
# the generated typed client at `frontend/src/lib/api`, and a fixed home means adding a
# backend later never moves a file.
id: frontend-react-vite
version: 1.0.0
frameworkVersion: "19"
kind: frontend
label: React + TypeScript (Vite)
slot: frontend

provides: [spa]
# Only `project-root`. §18 settles that a standalone frontend is supported, so requiring a
# REST API here would make the case the plan explicitly allows impossible to express. What
# the frontend does with a backend is conditional, not required.
requires: [project-root]

options:
  - id: typedClient
    type: boolean
    default: false
    label: Typed API client
    # `demands` is what makes a selection asking for this without a backend that can describe
    # itself fail at validate time rather than at `pnpm build` (§4, §18).
    demands: openapi-spec
    help: >-
      Generate the TypeScript API client from the backend's OpenAPI document instead of
      hand-writing it. Requires a backend that publishes one.

variables:
  required: [entityName, entityTable]

files:
  - from: files/**

  # Two spellings of the same four functions, at the same path, so the page imports
  # `@/api/{{ entityTable }}` either way and the option changes one file rather than every caller.
  # `tsconfig.app.json` comes along for the ride: generated code is not ours to restyle, and one
  # compiler flag has to come off for it. Two whole files rather than a patch, because `mergeJson`
  # refuses to overwrite a key that is already set — which is the right rule, and means a file that
  # differs by a setting is two files.
  - from: handwritten/**
    when: "!typedClient"
  - from: typed/**
    when: "typedClient"

  # The document the client is generated from has to come from a running application, and the
  # only thing in a generated project that knows how to start one with a database is its own test
  # suite. So this recipe ships a JVM test — which is less odd than it looks: the typed client is
  # this recipe's feature, and its contract belongs to it.
  - from: typed-java/**
    when: "typedClient && capability('java-sources')"
  - from: typed-kotlin/**
    when: "typedClient && capability('kotlin-sources')"

  # The image that serves this app, and the reverse proxy inside it, exist only when
  # containers were selected. Shipping an nginx.conf to a project with no container to
  # run it is the same tell as a README describing a database nobody chose.
  - from: container/**
    when: "capability('containers')"

# Three markers this recipe places and owns, for any recipe that guards or decorates the
# browser half (§31 is the first):
#
#   frontend/src/Gate.tsx      // kitbash:imports, // kitbash:gate
#   frontend/src/api/…         // kitbash:imports, // kitbash:headers
#
# `Gate` exists only to be that seam. `App` always renders through it, so a recipe that needs to
# stand in front of the application inserts four lines instead of rewriting a file it does not
# own — a patch can add lines, and cannot wrap an element.

patches:
  # base sets a four-space default, which is right for the JVM half and wrong here. Prettier
  # reads .editorconfig, so without this the generated project's own format check fails on
  # the generated project's own files — the sort of thing that only shows up once two recipes
  # really share a file.
  #
  # insertAtMarker rather than appendLines, because .editorconfig is sectioned: appendLines
  # dedupes line by line across the whole file, which is right for a .gitignore and wrong
  # here — `indent_size = 2` already appears under [*.{yaml,yml,json}] and the new section
  # would arrive empty.
  - op: insertAtMarker
    target: .editorconfig
    marker: "# kitbash:sections"
    lines:
      - "[*.{ts,tsx,js,jsx,mjs,cjs,css,html}]"
      - "indent_size = 2"
      - ""

  - op: appendLines
    target: .gitignore
    lines:
      - ""
      - "# Node"
      - "frontend/node_modules/"
      - "frontend/dist/"
      - "frontend/coverage/"
      - "frontend/.vite/"
      - "*.tsbuildinfo"

  # Vite only exposes VITE_-prefixed variables to the bundle, and it reads them at build
  # time — so this is a build input, not a compose environment entry. Writing it into the
  # container's environment would look like it worked and change nothing.
  - op: addEnvVar
    target: .env.example
    name: VITE_API_BASE_URL
    value: ""
    comment: >-
      Origin of the API. Empty means same-origin, which is what the dev server proxy and the
      container's nginx both arrange — set it only when the API lives elsewhere.

  - op: addComposeService
    target: compose.yaml
    when: "capability('containers')"
    service: web
    definition:
      build: ./frontend
      ports:
        - "3000:8080"

  # Two conditional halves of the same idea: when something in this selection serves a REST
  # API, the browser should reach it through this container rather than cross-origin.
  - op: mergeYaml
    target: compose.yaml
    when: "capability('containers') && capability('rest-api')"
    content:
      services:
        web:
          depends_on:
            - app
  - op: insertAtMarker
    target: frontend/nginx.conf
    when: "capability('containers') && capability('rest-api')"
    marker: "# kitbash:api-proxy"
    lines:
      - "    # Same-origin, so the browser needs no CORS and the API needs no allowlist."
      - "    location /api/ {"
      - "        proxy_pass http://app:8080;"
      - "        proxy_set_header Host $host;"
      - "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;"
      - "        proxy_set_header X-Forwarded-Proto $scheme;"
      - "        # Passed through so a request can be followed across both halves of the stack."
      - "        proxy_set_header X-Correlation-Id $http_x_correlation_id;"
      - "    }"
      - ""

  # The browser half in CI. Until §33 the generated pipeline built the JVM half and nothing else,
  # which made "the frontend compiles" a thing nobody checked.
  - op: insertAtMarker
    target: .gitlab-ci.yml
    when: "capability('ci')"
    marker: "# kitbash:jobs"
    lines:
      - "frontend:"
      - "  stage: build"
      - "  image: node:24-alpine"
      - "  before_script:"
      - "    - corepack enable"
      - "  cache:"
      - "    key:"
      - "      files: [frontend/pnpm-lock.yaml]"
      - "    paths: [frontend/.pnpm-store]"
      - "  script:"
      - "    - cd frontend"
      - "    - pnpm config set store-dir .pnpm-store"
      - "    - pnpm install --frozen-lockfile"
      - "    - pnpm lint"
      - "    - pnpm typecheck"
      - "    - pnpm test"
      - "    - pnpm build"
      - "{% if typedClient %}  needs: [client]{% endif %}"
      - ""

  # With the typed client on, the frontend cannot typecheck until the JVM half has described
  # itself — so the pipeline does what a developer does, in the order a developer does it.
  - op: insertAtMarker
    target: .gitlab-ci.yml
    when: "capability('ci') && typedClient"
    marker: "# kitbash:jobs"
    lines:
      - "client:"
      - "  stage: build"
      - "  # Docker-in-Docker, because generating the client starts the application against a real"
      - "  # database to ask it what its API looks like. That is the only way to get the document,"
      - "  # and it is the same thing the test suite already needs."
      - "  services:"
      - "    - docker:27-dind"
      - "  variables:"
      - "    DOCKER_HOST: tcp://docker:2375"
      - "    TESTCONTAINERS_RYUK_DISABLED: \"true\""
      - "  script:"
      - "    - ./gradlew --no-daemon generateApiClient"
      - "  artifacts:"
      - "    paths:"
      - "      - frontend/openapi.json"
      - "      - frontend/src/lib/api"
      - "    expire_in: 1 day"
      - ""

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:stack -->"
    lines:
      - "- **Frontend** — React {{ frameworkVersion }} with TypeScript and Vite, served by nginx in a non-root container"

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:work -->"
    lines:
      - "```bash"
      - "cd frontend"
      - "pnpm install"
      - "pnpm dev                      # http://localhost:5173, /api proxied to the backend"
      - "pnpm build                    # typecheck and production bundle"
      - "pnpm test                     # component tests, jsdom"
      - "pnpm lint                     # ESLint and Prettier, both failing the build"
      - "```"
      - ""

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:layout -->"
    lines:
      - "```"
      - "frontend/src/"
      - "  api/      the only file that knows the shape of the API"
      - "  pages/    one page per route, with its test beside it"
      - "```"
      - ""

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **The API lives behind `frontend/src/api/`.** A `fetch` in a component is a call the"
      - "  generated typed client cannot replace, and replacing that one file is the whole point"
      - "  of the option."
      - "- **Requests are same-origin.** The dev server proxies `/api`, and so does the container's"
      - "  nginx, so nothing needs CORS."

  # ---------------------------------------------------------------------------------------
  # The typed client (§15, §33). Everything below is inert unless `typedClient` is on.
  #
  # It patches files the *backend* recipes own, which is the right way round: `typedClient` is
  # declared here, and a `when` may only read an option its own recipe declared. A backend
  # cannot gate on a frontend's option, so the wiring lives with the option.
  # ---------------------------------------------------------------------------------------
  - op: insertAtMarker
    target: gradle/libs.versions.toml
    when: "typedClient && capability('gradle-build')"
    marker: "# kitbash:versions"
    lines:
      - 'openapi-generator = "7.14.0"'

  - op: insertAtMarker
    target: gradle/libs.versions.toml
    when: "typedClient && capability('gradle-build')"
    marker: "# kitbash:plugins"
    lines:
      - 'openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }'

  - op: insertAtMarker
    target: build.gradle.kts
    when: "typedClient && capability('gradle-build')"
    marker: "// kitbash:plugins"
    lines:
      - "    alias(libs.plugins.openapi.generator)"

  - op: insertAtMarker
    target: build.gradle.kts
    when: "typedClient && capability('gradle-build')"
    marker: "// kitbash:build"
    lines:
      - "// The typed client (§15): the browser's types are the server's DTOs, so renaming a field"
      - "// here is a compile error at the call site over there rather than a runtime surprise."
      - "//"
      - "// Two steps, because springdoc describes a *running* application. `dumpOpenApiDocument`"
      - "// starts one — with a real database, through the test suite that already knows how —"
      - "// and writes the document; `openApiGenerate` turns it into TypeScript."
      - "val openApiDocument = layout.projectDirectory.file(\"frontend/openapi.json\")"
      - ""
      - "val dumpOpenApiDocument by tasks.registering(Test::class) {"
      - '    group = "openapi"'
      - '    description = "Starts the application and writes frontend/openapi.json."'
      - "    testClassesDirs = sourceSets[\"test\"].output.classesDirs"
      - "    classpath = sourceSets[\"test\"].runtimeClasspath"
      - "    useJUnitPlatform()"
      - "    filter { includeTestsMatching(\"*OpenApiDocumentTest\") }"
      - "    systemProperty(\"kitbash.openapi.write\", \"true\")"
      - "    outputs.file(openApiDocument)"
      - "    outputs.upToDateWhen { false }"
      - "}"
      - ""
      - "openApiGenerate {"
      - '    generatorName = "typescript-fetch"'
      - "    inputSpec = openApiDocument.asFile.absolutePath"
      - "    outputDir = layout.projectDirectory.dir(\"frontend/src/lib/api\").asFile.absolutePath"
      - "    // withoutRuntimeChecks: the server validates its own input and returns RFC 9457 when it"
      - "    // is wrong, so a second copy of the rules in the browser is two places to change."
      - '    configOptions = mapOf("supportsES6" to "true", "withoutRuntimeChecks" to "true")'
      - "}"
      - ""
      - "tasks.named(\"openApiGenerate\") { dependsOn(dumpOpenApiDocument) }"
      - ""
      - "tasks.register(\"generateApiClient\") {"
      - '    group = "openapi"'
      - '    description = "Regenerates frontend/src/lib/api from the OpenAPI document."'
      - "    dependsOn(\"openApiGenerate\")"
      - "}"
      - ""

  - op: insertAtMarker
    target: pom.xml
    when: "typedClient && capability('maven-build')"
    marker: "<!-- kitbash:versions -->"
    lines:
      - "    <openapi-generator.version>7.14.0</openapi-generator.version>"

  # Maven's equivalent, in a profile: `./mvnw -Pclient verify` runs the document-writing test in
  # the `test` phase and the generator in `prepare-package`, which is one lifecycle rather than
  # two invocations somebody has to remember the order of.
  - op: insertAtMarker
    target: pom.xml
    when: "typedClient && capability('maven-build')"
    marker: "<!-- kitbash:profiles -->"
    lines:
      - "    <profile>"
      - "      <id>client</id>"
      - "      <properties>"
      - "        <kitbash.openapi.write>true</kitbash.openapi.write>"
      - "      </properties>"
      - "      <build>"
      - "        <plugins>"
      - "          <plugin>"
      - "            <groupId>org.openapitools</groupId>"
      - "            <artifactId>openapi-generator-maven-plugin</artifactId>"
      - "            <version>${openapi-generator.version}</version>"
      - "            <executions>"
      - "              <execution>"
      - "                <id>typescript-client</id>"
      - "                <phase>prepare-package</phase>"
      - "                <goals>"
      - "                  <goal>generate</goal>"
      - "                </goals>"
      - "                <configuration>"
      - "                  <inputSpec>${project.basedir}/frontend/openapi.json</inputSpec>"
      - "                  <generatorName>typescript-fetch</generatorName>"
      - "                  <output>${project.basedir}/frontend/src/lib/api</output>"
      - "                  <configOptions>"
      - "                    <supportsES6>true</supportsES6>"
      - "                    <withoutRuntimeChecks>true</withoutRuntimeChecks>"
      - "                  </configOptions>"
      - "                </configuration>"
      - "              </execution>"
      - "            </executions>"
      - "          </plugin>"
      - "        </plugins>"
      - "      </build>"
      - "    </profile>"

  # Prettier would reformat every file openapi-generator writes, and then check them again next
  # time it ran. Generated code is checked by the generator being correct, not by our line width.
  - op: appendLines
    target: frontend/.prettierignore
    when: "typedClient"
    lines:
      - ""
      - "# Generated by ./gradlew generateApiClient"
      - "openapi.json"
      - "src/lib/api"

  - op: insertAtMarker
    target: frontend/eslint.config.js
    when: "typedClient"
    marker: "// kitbash:ignores"
    lines:
      - "  { ignores: ['src/lib/api'] },"

  # Generated, not committed. Which of the two it is, is a decision §33 insists is made out loud:
  # the document and the client both depend on which recipes were selected — the modular monolith
  # publishes an endpoint the layered one does not — so there is no one correct file to ship, and
  # a stale committed client is a lie that typechecks.
  - op: appendLines
    target: .gitignore
    when: "typedClient"
    lines:
      - ""
      - "# Generated by ./gradlew generateApiClient"
      - "frontend/openapi.json"
      - "frontend/src/lib/api/"

  - op: insertAtMarker
    target: README.md
    when: "typedClient"
    marker: "<!-- kitbash:work -->"
    lines:
      - "```bash"
      - "./gradlew generateApiClient   # writes frontend/src/lib/api from the API's own OpenAPI document"
      - "```"
      - ""
      - "The typed client is **generated, not committed**: it depends on which recipes this project"
      - "was made with, so there is no single correct version of it to ship, and a stale committed"
      - "one is a lie that typechecks. Run that command once after cloning — it needs Docker, because"
      - "it starts the application against a real database to ask it what its API looks like."
      - ""

  - op: insertAtMarker
    target: README.md
    when: "typedClient"
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **The frontend's types are the backend's DTOs.** Rename a field on the server, run"
      - "  `./gradlew generateApiClient`, and `pnpm build` fails at the call site. That binding is"
      - "  the difference between a full-stack project and two folders in a zip."
