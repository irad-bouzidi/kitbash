# yaml-language-server: $schema=../_schema/recipe.schema.json
id: build-gradle-kts
version: 1.0.0
frameworkVersion: "8.14"
kind: base
label: Gradle (Kotlin DSL)
slot: buildTool
# `gradle-build` is what lets another recipe say "the build file here is a Gradle one"
# without naming this recipe (§4). Two build tools both provide `build-tool`; what a
# framework recipe needs to know is which spelling to use, and that is a property of the
# project rather than an identity.
provides: [build-tool, gradle-build]
requires: [project-root]

# The version catalog is assembled from the union of the selected recipes rather than
# written out here, which is a computation no manifest field could express — see
# docs/hooks.md for why that earns a hook and what the alternative would have been.
hook: true

# Versions this recipe pins, and where the weekly bump job looks for newer ones (§36).
#
# Declared rather than discovered: a job that guesses which literals are versions
# eventually rewrites a port number. `version` is the exact string this recipe writes —
# in frameworkVersion, in a catalog entry, in a coordinate, in a pom property — and the
# bump replaces every occurrence of it inside this directory at once, which is what
# makes a Spring Boot bump land as one coherent change rather than four.
tracks:
  - version: "7.2.1"
    artifact: com.diffplug.spotless:spotless-plugin-gradle
    label: Spotless

variables:
  required: [groupId, javaVersion]

files:
  - from: files/**

patches:
  # Appended rather than owned by `base`: a project without Gradle has no reason to
  # ignore .gradle/, and a .gitignore listing directories that never appear is the
  # same tell as a README describing a database nobody selected.
  - op: appendLines
    target: .gitignore
    lines:
      - ""
      - "# Gradle"
      - ".gradle/"
      - "build/"
      - "!gradle/wrapper/gradle-wrapper.jar"

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:stack -->"
    lines:
      - "- **Build** — Gradle {{ frameworkVersion }} with the Kotlin DSL, dependencies in a version catalog"

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:work -->"
    lines:
      - "```bash"
      - "./gradlew build               # compile, format check, unit and integration tests"
      - "```"
      - ""

  - op: insertAtMarker
    target: README.md
    marker: "<!-- kitbash:rules -->"
    lines:
      - "- **Formatting is a build failure**, not a review comment — `./gradlew spotlessApply`."
