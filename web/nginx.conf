server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The same-origin proxy the Vite dev server provides, so the download stays a
    # navigation and no CORS configuration exists anywhere.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A generated zip is streamed; buffering it here would hide download
        # progress from the browser, which is the whole point of the form post.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
