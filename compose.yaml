# `docker compose up` runs the whole thing: database, object store, API and web app.
name: kitbash

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kitbash
      POSTGRES_USER: kitbash
      POSTGRES_PASSWORD: kitbash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitbash -d kitbash"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io, not Docker Hub: MinIO no longer publishes these tags there, and a
    # compose file that cannot pull is worse than no compose file.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kitbash
      MINIO_ROOT_PASSWORD: kitbash-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      # The repository root, because the phase-0 generator stages /reference onto
      # the api classpath at build time.
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    # Deliberately no depends_on yet: phase 0 holds its workspace in memory and
    # talks to neither service. Postgres arrives with kitbash-21, the object store
    # with kitbash-27, and each adds its own healthcheck condition here.

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
