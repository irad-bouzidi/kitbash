# `docker compose up` runs the whole thing: database, object store, API and web app.
name: kitbash

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kitbash
      POSTGRES_USER: kitbash
      POSTGRES_PASSWORD: kitbash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitbash -d kitbash"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Was MinIO until 2026-09-24, when its community images went behind authentication on
  # both registries at once: quay.io/minio/minio and minio/minio on Docker Hub now answer an
  # anonymous pull with "unauthorized". The comment this replaces recorded half of it — Docker
  # Hub had already stopped — and a compose file that cannot pull is worse than no compose file.
  #
  # LocalStack is on Docker Hub, pulls anonymously, and speaks S3, which is all this ever needed:
  # the server talks to an endpoint, not to MinIO. The service keeps its name so nothing that
  # refers to it has to change.
  minio:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: s3
      # Any credentials are accepted; these are the ones the server is configured with, so the
      # two agree without a second place to keep them in step.
      AWS_ACCESS_KEY_ID: kitbash
      AWS_SECRET_ACCESS_KEY: kitbash-dev-secret
    ports:
      - "9000:4566"
    volumes:
      - minio-data:/var/lib/localstack
    healthcheck:
      # LocalStack's own readiness endpoint. `mc ready` went with MinIO, and a healthcheck that
      # cannot run leaves the service permanently unhealthy rather than obviously broken.
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The stub identity provider, so the whole stack runs on a laptop without the corporate one.
  #
  # It stubs the *issuer*, not the security: the API runs its real filter chain against real
  # signed tokens, so a mistake in the authorization rules shows up here rather than in
  # production. `interactiveLogin` gives a login page where any username works — the point is a
  # token with the right shape, not an authentication decision.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.11
    ports:
      - "9500:8080"
    environment:
      # No login prompt, and a token that carries both roles. Signing in locally should be a
      # redirect the developer does not see, and it should grant everything §13 gates — otherwise
      # the first person to work on presets discovers their dev token cannot write one.
      #
      # Keyed on client_id rather than scope: a code exchange does not send `scope`, so a mapping
      # on it matches the client-credentials grant and silently misses the browser's. The symptom
      # was an ID token with no subject, which oidc-client-ts rightly refuses.
      JSON_CONFIG: >-
        {
          "interactiveLogin": false,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "kitbash",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "client_id",
                  "match": "kitbash-web",
                  "claims": {
                    "sub": "dev-user",
                    "roles": ["kitbash-author", "kitbash-publisher"]
                  }
                }
              ]
            }
          ]
        }
    # No healthcheck: the image is distroless, so there is no shell or wget inside it to run one
    # with. Nothing here needs one — the API verifies tokens against the key set and fetches it on
    # the first request rather than at startup, so the issuer only has to be up before somebody
    # signs in, not before the service boots.

  server:
    build:
      # The repository root, because the phase-0 generator stages /reference onto
      # the api classpath at build time.
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # The database is opt-in (§10, §12): /metadata, /validate and /generate need no
      # persistence, so the service starts without one and a missing Postgres cannot take
      # the generator down with it. This profile is what a deployment with a database runs.
      SPRING_PROFILES_ACTIVE: persistence,dev-auth,objectstore
      KITBASH_DB_URL: jdbc:postgresql://postgres:5432/kitbash
      KITBASH_DB_USER: kitbash
      KITBASH_DB_PASSWORD: kitbash
      # §10's zip cache. Determinism is what makes serving a hit verbatim safe, and the bucket's
      # own lifecycle rule is what expires it after thirty days.
      # 4566 is LocalStack's own port; the 9000 in the host mapping above is only for a
      # browser or an aws-cli on the laptop, and does not apply inside this network.
      KITBASH_S3_ENDPOINT: http://minio:4566
      KITBASH_S3_BUCKET: kitbash-artifacts
      KITBASH_S3_ACCESS_KEY: kitbash
      KITBASH_S3_SECRET_KEY: kitbash-dev-secret
    depends_on:
      postgres:
        # Flyway runs at startup, so the database has to be accepting connections rather
        # than merely started.
        condition: service_healthy
      oidc:
        condition: service_started
      minio:
        # The bucket is created at startup, so the store has to be answering by then. A cache
        # that is merely late would be shrugged off; one that is absent means no bucket.
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # Build arguments rather than environment: Vite resolves these when the bundle is built,
      # and a static file server has nothing left to substitute at startup.
      #
      # The browser reaches the stub on the host's published port, which is a different address
      # from the one the API uses inside the network — see the note in application.yaml about why
      # the dev profile verifies against the key set rather than the issuer claim.
      args:
        VITE_OIDC_ISSUER: http://localhost:9500/kitbash
        VITE_OIDC_CLIENT_ID: kitbash-web
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
